<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Poker Club</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
        }

        button {
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:active {
            transform: scale(0.97);
            opacity: 0.8;
        }
    </style>
</head>


<body class="text-white min-h-screen">


<div class="max-w-md mx-auto px-5 pt-6 pb-28">


    <!-- =========================
         ГЛАВНЫЙ ЭКРАН
    ========================== -->

    <div id="homeScreen">


        <!-- HEADER -->

        <div class="flex justify-between items-center mb-8">

            <div>

                <p
                    id="welcomeText"
                    class="text-gray-500 text-sm mb-1"
                >
                    Добро пожаловать
                </p>

                <h1 class="text-2xl font-bold tracking-tight">
                    Poker Club
                </h1>

            </div>


            <div
                id="avatar"
                class="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center overflow-hidden"
            >
                ♠
            </div>

        </div>


        <!-- СТАТУС -->

        <div
            id="authStatus"
            class="hidden"
        >
        </div>


        <!-- =========================
             БЛИЖАЙШАЯ ИГРА
        ========================== -->

        <section class="mb-5">

            <div class="flex justify-between items-center mb-3">

                <p class="text-gray-500 text-sm uppercase tracking-wider">
                    Ближайшая игра
                </p>

                <button
                    onclick="showGames()"
                    class="text-sm text-gray-400"
                >
                    Все игры →
                </button>

            </div>


            <div
                id="nextGameCard"
                class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5"
            >

                <div class="flex justify-between items-start mb-5">

                    <div>

                        <p
                            id="nextGameDate"
                            class="text-gray-400 text-sm"
                        >
                            —
                        </p>

                        <h2
                            id="nextGameTitle"
                            class="text-xl font-semibold mt-1"
                        >
                            Загрузка...
                        </h2>

                    </div>


                    <div
                        id="nextGameType"
                        class="bg-zinc-800 rounded-xl px-3 py-1.5 text-xs text-gray-300"
                    >
                        —
                    </div>

                </div>


                <div class="grid grid-cols-2 gap-3 mb-5">


                    <div class="bg-zinc-800/60 rounded-2xl p-3">

                        <p class="text-gray-500 text-xs mb-1">
                            Время
                        </p>

                        <p
                            id="nextGameTime"
                            class="font-medium"
                        >
                            —
                        </p>

                    </div>


                    <div class="bg-zinc-800/60 rounded-2xl p-3">

                        <p class="text-gray-500 text-xs mb-1">
                            Игроки
                        </p>

                        <p
                            id="nextGamePlayers"
                            class="font-medium"
                        >
                            —
                        </p>

                    </div>

                </div>


                <button
                    onclick="showGames()"
                    class="w-full bg-white text-black rounded-2xl py-3.5 font-semibold"
                >
                    Посмотреть игру
                </button>

            </div>

        </section>


        <!-- =========================
             МОЙ РЕЙТИНГ
        ========================== -->

        <section class="mb-5">

            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5">

                <div class="flex justify-between items-start">

                    <div>

                        <p class="text-gray-500 text-sm mb-2">
                            Мой рейтинг
                        </p>

                        <div class="flex items-baseline gap-2">

                            <span
                                id="myRating"
                                class="text-5xl font-bold tracking-tight"
                            >
                                0
                            </span>

                            <span class="text-gray-500">
                                очков
                            </span>

                        </div>

                    </div>


                    <button
                        onclick="showScreen('rating')"
                        class="text-gray-400 text-sm"
                    >
                        Таблица →
                    </button>

                </div>


                <div class="mt-5 pt-4 border-t border-zinc-800">

                    <p
                        id="myGames"
                        class="text-gray-400 text-sm"
                    >
                        Сыграно игр: 0
                    </p>

                </div>

            </div>

        </section>


        <!-- =========================
             БЫСТРЫЕ ДЕЙСТВИЯ
        ========================== -->

        <section>

            <p class="text-gray-500 text-sm uppercase tracking-wider mb-3">
                Быстрый доступ
            </p>


            <div class="grid grid-cols-2 gap-3">


                <button
                    onclick="showGames()"
                    class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 text-left"
                >

                    <div class="text-2xl mb-4">
                        🎯
                    </div>

                    <p class="font-semibold">
                        Игры
                    </p>

                    <p class="text-gray-500 text-sm mt-1">
                        Расписание и запись
                    </p>

                </button>


                <button
                    onclick="showScreen('rating')"
                    class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 text-left"
                >

                    <div class="text-2xl mb-4">
                        🏆
                    </div>

                    <p class="font-semibold">
                        Рейтинг
                    </p>

                    <p class="text-gray-500 text-sm mt-1">
                        Таблица игроков
                    </p>

                </button>

            </div>

        </section>


    </div>


    <!-- =========================
         ЭКРАН ИГР
    ========================== -->

    <div
        id="gamesScreen"
        class="hidden"
    >

        <div class="flex items-center mb-8">

            <button
                onclick="showScreen('home')"
                class="text-gray-400 mr-4 text-2xl"
            >
                ←
            </button>

            <h1 class="text-2xl font-bold">
                Игры
            </h1>

        </div>


        <div
            id="gamesList"
            class="space-y-3"
        >

            <div class="bg-zinc-900 rounded-3xl p-5 text-center">

                <p class="text-gray-500">
                    Загрузка игр...
                </p>

            </div>

        </div>

    </div>


    <!-- =========================
         ЭКРАН РЕЙТИНГА
    ========================== -->

    <div
        id="ratingScreen"
        class="hidden"
    >

        <div class="flex items-center mb-8">

            <button
                onclick="showScreen('home')"
                class="text-gray-400 mr-4 text-2xl"
            >
                ←
            </button>

            <h1 class="text-2xl font-bold">
                Рейтинг
            </h1>

        </div>


        <div
            id="leaderboard"
            class="space-y-3"
        >
        </div>

    </div>


    <!-- =========================
         ПРОФИЛЬ
    ========================== -->

    <div
        id="profileScreen"
        class="hidden"
    >

        <div class="flex items-center mb-8">

            <button
                onclick="showScreen('home')"
                class="text-gray-400 mr-4 text-2xl"
            >
                ←
            </button>

            <h1 class="text-2xl font-bold">
                Профиль
            </h1>

        </div>


        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 text-center">

            <div
                id="profileAvatar"
                class="w-20 h-20 rounded-full bg-zinc-800 mx-auto mb-4 flex items-center justify-center text-3xl overflow-hidden"
            >
                ♠
            </div>


            <h2
                id="profileName"
                class="text-xl font-semibold"
            >
                Игрок
            </h2>


            <p
                id="profileUsername"
                class="text-gray-500 text-sm mt-1"
            >
                —
            </p>


            <div class="grid grid-cols-2 gap-3 mt-6">


                <div class="bg-zinc-800/60 rounded-2xl p-4">

                    <p class="text-gray-500 text-xs">
                        Рейтинг
                    </p>

                    <p
                        id="profileRating"
                        class="text-2xl font-bold mt-1"
                    >
                        0
                    </p>

                </div>


                <div class="bg-zinc-800/60 rounded-2xl p-4">

                    <p class="text-gray-500 text-xs">
                        Игр
                    </p>

                    <p
                        id="profileGames"
                        class="text-2xl font-bold mt-1"
                    >
                        0
                    </p>

                </div>

            </div>

        </div>

    </div>


</div>


<!-- =========================
     НИЖНЯЯ НАВИГАЦИЯ
========================== -->

<div
    id="navigation"
    class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur border-t border-zinc-800"
>

    <div class="max-w-md mx-auto grid grid-cols-3 px-5 py-3">


        <button
            onclick="showScreen('home')"
            class="text-center text-gray-400"
        >

            <div class="text-xl">
                ⌂
            </div>

            <div class="text-xs mt-1">
                Главная
            </div>

        </button>


        <button
            onclick="showScreen('rating')"
            class="text-center text-gray-400"
        >

            <div class="text-xl">
                ♛
            </div>

            <div class="text-xs mt-1">
                Рейтинг
            </div>

        </button>


        <button
            onclick="showScreen('profile')"
            class="text-center text-gray-400"
        >

            <div class="text-xl">
                ●
            </div>

            <div class="text-xs mt-1">
                Профиль
            </div>

        </button>


    </div>

</div>


<script>


/* =========================
   TELEGRAM
========================= */

let tg = null;
let currentUserId = null;
let currentTelegramUser = null;


/* =========================
   TELEGRAM SDK
========================= */

function initTelegram() {

    if (
        !window.Telegram ||
        !window.Telegram.WebApp
    ) {

        console.error(
            "Telegram WebApp SDK отсутствует"
        );

        return false;
    }


    tg = window.Telegram.WebApp;


    tg.ready();
    tg.expand();


    return true;
}


/* =========================
   АВТОРИЗАЦИЯ
========================= */

async function authorizeUser() {

    if (!tg) {
        return false;
    }


    try {

        const initData =
            tg.initData;


        if (!initData) {

            console.error(
                "Telegram initData отсутствует"
            );

            return false;
        }


        const response =
            await fetch(
                window.location.origin +
                "/auth/telegram",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        init_data:
                            initData
                    })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Ошибка авторизации:",
                response.status,
                errorText
            );

            return false;
        }


        const data =
            await response.json();


        currentUserId =
            data.user_id;


        currentTelegramUser =
            tg.initDataUnsafe?.user || null;


        updateUserInterface();


        return true;

    } catch (error) {

        console.error(
            "Ошибка авторизации:",
            error
        );

        return false;
    }
}


/* =========================
   ДАННЫЕ ПОЛЬЗОВАТЕЛЯ
========================= */

function updateUserInterface() {

    if (!currentTelegramUser) {
        return;
    }


    const firstName =
        currentTelegramUser.first_name ||
        "Игрок";


    document.getElementById(
        "welcomeText"
    ).textContent =
        "Привет, " + firstName;


    const avatar =
        document.getElementById(
            "avatar"
        );


    const profileAvatar =
        document.getElementById(
            "profileAvatar"
        );


    if (
        currentTelegramUser.photo_url
    ) {

        const image = `
            <img
                src="${currentTelegramUser.photo_url}"
                class="w-full h-full object-cover"
            >
        `;


        avatar.innerHTML =
            image;


        profileAvatar.innerHTML =
            image;

    }


    const fullName =
        (
            currentTelegramUser.first_name ||
            "" +
            " " +
            (
                currentTelegramUser.last_name ||
                ""
            )
        ).trim();


    document.getElementById(
        "profileName"
    ).textContent =
        fullName ||
        "Игрок";


    document.getElementById(
        "profileUsername"
    ).textContent =
        currentTelegramUser.username
            ? "@" + currentTelegramUser.username
            : "Telegram";


}


/* =========================
   МОЙ РЕЙТИНГ
========================= */

async function loadMyRating() {

    if (!currentUserId) {
        return;
    }


    try {

        const response =
            await fetch(
                window.location.origin +
                "/rating/user/" +
                currentUserId,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        const rating =
            data.rating ?? 0;


        const games =
            data.games_played ?? 0;


        document.getElementById(
            "myRating"
        ).textContent =
            rating;


        document.getElementById(
            "myGames"
        ).textContent =
            "Сыграно игр: " +
            games;


        document.getElementById(
            "profileRating"
        ).textContent =
            rating;


        document.getElementById(
            "profileGames"
        ).textContent =
            games;


    } catch (error) {

        console.error(
            "Ошибка загрузки рейтинга:",
            error
        );

    }

}


/* =========================
   РЕЙТИНГ ИГРОКОВ
========================= */

async function loadRating() {

    const leaderboard =
        document.getElementById(
            "leaderboard"
        );


    leaderboard.innerHTML = `
        <div class="bg-zinc-900 rounded-3xl p-5 text-center">
            <p class="text-gray-500">
                Загрузка рейтинга...
            </p>
        </div>
    `;


    try {

        const response =
            await fetch(
                window.location.origin +
                "/rating/",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (!Array.isArray(data)) {

            throw new Error(
                "Неверный формат рейтинга"
            );
        }


        if (data.length === 0) {

            leaderboard.innerHTML = `
                <div class="bg-zinc-900 rounded-3xl p-5 text-center">
                    <p class="text-gray-500">
                        Пока нет игроков
                    </p>
                </div>
            `;

            return;
        }


        leaderboard.innerHTML = "";


        data.forEach(
            function(player, index) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "bg-zinc-900 border border-zinc-800 rounded-3xl p-5";


                const name =
                    (
                        (
                            player.first_name ||
                            ""
                        ) +
                        " " +
                        (
                            player.last_name ||
                            ""
                        )
                    ).trim() ||
                    "Игрок";


                card.innerHTML = `

                    <div class="flex items-center justify-between">

                        <div class="flex items-center gap-4">

                            <div class="w-8 text-center text-lg font-bold text-gray-500">
                                ${index + 1}
                            </div>

                            <div>

                                <p class="font-semibold">
                                    ${name}
                                </p>

                                <p class="text-gray-500 text-sm">
                                    ${player.games_played ?? 0} игр
                                </p>

                            </div>

                        </div>


                        <div class="text-right">

                            <p class="text-xl font-bold">
                                ${player.rating ?? 0}
                            </p>

                            <p class="text-gray-500 text-xs">
                                очков
                            </p>

                        </div>

                    </div>

                `;


                leaderboard.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            "Ошибка загрузки рейтинга:",
            error
        );


        leaderboard.innerHTML = `
            <div class="bg-zinc-900 rounded-3xl p-5 text-center">

                <p class="text-red-400">
                    Не удалось загрузить рейтинг
                </p>

            </div>
        `;

    }

}


/* =========================
   ЭКРАНЫ
========================= */

function hideAllScreens() {

    document.getElementById(
        "homeScreen"
    ).classList.add("hidden");


    document.getElementById(
        "gamesScreen"
    ).classList.add("hidden");


    document.getElementById(
        "ratingScreen"
    ).classList.add("hidden");


    document.getElementById(
        "profileScreen"
    ).classList.add("hidden");

}


/* =========================
   ПОКАЗ ЭКРАНА
========================= */

function showScreen(screen) {

    hideAllScreens();


    if (screen === "home") {

        document.getElementById(
            "homeScreen"
        ).classList.remove("hidden");

        return;
    }


    if (screen === "rating") {

        document.getElementById(
            "ratingScreen"
        ).classList.remove("hidden");

        loadRating();

        return;
    }


    if (screen === "profile") {

        document.getElementById(
            "profileScreen"
        ).classList.remove("hidden");

        return;
    }


    if (screen === "games") {

        document.getElementById(
            "gamesScreen"
        ).classList.remove("hidden");

        loadGames();

        return;
    }

}


/* =========================
   ИГРЫ
========================= */

function showGames() {

    showScreen("games");

}


async function loadGames() {

    const gamesList =
        document.getElementById(
            "gamesList"
        );


    gamesList.innerHTML = `
        <div class="bg-zinc-900 rounded-3xl p-5 text-center">
            <p class="text-gray-500">
                Загрузка игр...
            </p>
        </div>
    `;


    try {

        const response =
            await fetch(
                window.location.origin +
                "/games/",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!Array.isArray(data)) {

            throw new Error(
                "Неверный формат игр"
            );

        }


        if (data.length === 0) {

            gamesList.innerHTML = `
                <div class="bg-zinc-900 rounded-3xl p-6 text-center">

                    <p class="text-gray-400">
                        Пока игр нет
                    </p>

                    <p class="text-gray-600 text-sm mt-2">
                        Здесь появятся ближайшие игры клуба
                    </p>

                </div>
            `;

            updateNextGame(null);

            return;
        }


        gamesList.innerHTML = "";


        data.forEach(
            function(game) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "bg-zinc-900 border border-zinc-800 rounded-3xl p-5";


                const title =
                    game.name ||
                    game.title ||
                    "Игра";


                const type =
                    game.type ||
                    "Игра";


                const date =
                    game.start_at
                        ? new Date(
                            game.start_at
                        )
                        : null;


                let dateText = "Дата не указана";
                let timeText = "—";


                if (date) {

                    dateText =
                        date.toLocaleDateString(
                            "ru-RU",
                            {
                                day: "numeric",
                                month: "long"
                            }
                        );


                    timeText =
                        date.toLocaleTimeString(
                            "ru-RU",
                            {
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        );

                }


                card.innerHTML = `

                    <div class="flex justify-between items-start">

                        <div>

                            <p class="text-gray-500 text-sm">
                                ${dateText}
                            </p>

                            <h2 class="font-semibold text-lg mt-1">
                                ${title}
                            </h2>

                        </div>

                        <div class="bg-zinc-800 rounded-xl px-3 py-1.5 text-xs">
                            ${type}
                        </div>

                    </div>


                    <div class="flex justify-between mt-5 text-sm">

                        <span class="text-gray-500">
                            Время
                        </span>

                        <span>
                            ${timeText}
                        </span>

                    </div>

                `;


                gamesList.appendChild(
                    card
                );

            }
        );


        updateNextGame(data[0]);


    } catch (error) {

        console.error(
            "Ошибка загрузки игр:",
            error
        );


        gamesList.innerHTML = `
            <div class="bg-zinc-900 rounded-3xl p-5 text-center">

                <p class="text-red-400">
                    Не удалось загрузить игры
                </p>

            </div>
        `;

    }

}


/* =========================
   БЛИЖАЙШАЯ ИГРА
========================= */

function updateNextGame(game) {

    if (!game) {

        document.getElementById(
            "nextGameTitle"
        ).textContent =
            "Пока игр нет";

        document.getElementById(
            "nextGameDate"
        ).textContent =
            "—";

        document.getElementById(
            "nextGameTime"
        ).textContent =
            "—";

        document.getElementById(
            "nextGamePlayers"
        ).textContent =
            "—";

        document.getElementById(
            "nextGameType"
        ).textContent =
            "—";

        return;
    }


    document.getElementById(
        "nextGameTitle"
    ).textContent =
        game.name ||
        game.title ||
        "Игра";


    document.getElementById(
        "nextGameType"
    ).textContent =
        game.type ||
        "Игра";


    if (game.start_at) {

        const date =
            new Date(
                game.start_at
            );


        document.getElementById(
            "nextGameDate"
        ).textContent =
            date.toLocaleDateString(
                "ru-RU",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );


        document.getElementById(
            "nextGameTime"
        ).textContent =
            date.toLocaleTimeString(
                "ru-RU",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }


    document.getElementById(
        "nextGamePlayers"
    ).textContent =
        game.max_players
            ? "до " + game.max_players
            : "—";

}


/* =========================
   ЗАПУСК
========================= */

async function initApp() {

    console.log(
        "Poker Club запускается"
    );


    const telegramReady =
        initTelegram();


    if (!telegramReady) {
        return;
    }


    const authorized =
        await authorizeUser();


    if (authorized) {

        await loadMyRating();

        await loadGames();

    }


    console.log(
        "Poker Club запущен"
    );

}


initApp();


</script>


</body>
</html>

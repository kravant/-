<script>

/* =====================================================
   ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
===================================================== */

let tg = null;

let currentUserId = null;

let currentTelegramUser = null;

let telegramInitData = "";

let isAdmin = false;


/* =====================================================
   TELEGRAM
===================================================== */

function initTelegram() {

    if (
        !window.Telegram ||
        !window.Telegram.WebApp
    ) {

        console.error(
            "Telegram WebApp SDK отсутствует"
        );

        return false;
    }


    tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();


    telegramInitData =
        tg.initData || "";


    return true;
}


/* =====================================================
   АВТОРИЗАЦИЯ
===================================================== */

async function authorizeUser() {

    if (!tg) {
        return false;
    }


    if (!telegramInitData) {

        console.error(
            "Telegram initData отсутствует"
        );

        return false;
    }


    try {

        const response =
            await fetch(
                window.location.origin +
                "/auth/telegram",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        init_data:
                            telegramInitData
                    })
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Ошибка авторизации:",
                error
            );

            return false;
        }


        const data =
            await response.json();


        currentUserId =
            data.user_id;


        currentTelegramUser =
            tg.initDataUnsafe?.user ||
            null;


        updateUserInterface();


        /*
         * Проверяем админку через backend.
         */
        await checkAdmin();


        return true;


    } catch (error) {

        console.error(
            "Ошибка авторизации:",
            error
        );

        return false;
    }
}


/* =====================================================
   ПРОВЕРКА АДМИНА
===================================================== */

async function checkAdmin() {

    if (!telegramInitData) {

        isAdmin = false;

        return false;
    }


    try {

        const response =
            await fetch(
                window.location.origin +
                "/admin/check",
                {
                    method: "GET",

                    headers: {
                        "X-Telegram-Init-Data":
                            telegramInitData
                    },

                    cache: "no-store"
                }
            );


        if (!response.ok) {

            isAdmin = false;

            document
                .getElementById(
                    "adminHomeSection"
                )
                .classList.add(
                    "hidden"
                );

            return false;
        }


        const data =
            await response.json();


        isAdmin =
            data.is_admin === true;


        if (isAdmin) {

            document
                .getElementById(
                    "adminHomeSection"
                )
                .classList
                .remove(
                    "hidden"
                );

        } else {

            document
                .getElementById(
                    "adminHomeSection"
                )
                .classList
                .add(
                    "hidden"
                );
        }


        return isAdmin;


    } catch (error) {

        console.error(
            "Ошибка проверки админа:",
            error
        );


        isAdmin = false;

        return false;
    }
}


/* =====================================================
   АДМИНСКИЙ ЗАГОЛОВОК
===================================================== */

function adminHeaders() {

    return {
        "Content-Type":
            "application/json",

        "X-Telegram-Init-Data":
            telegramInitData
    };
}


/* =====================================================
   ДАННЫЕ ПОЛЬЗОВАТЕЛЯ
===================================================== */

function updateUserInterface() {

    if (!currentTelegramUser) {
        return;
    }


    const firstName =
        currentTelegramUser.first_name ||
        "Игрок";


    document.getElementById(
        "welcomeText"
    ).textContent =
        "Привет, " + firstName;


    const avatar =
        document.getElementById(
            "avatar"
        );


    const profileAvatar =
        document.getElementById(
            "profileAvatar"
        );


    if (
        currentTelegramUser.photo_url
    ) {

        const image = `
            <img
                src="${currentTelegramUser.photo_url}"
                class="w-full h-full object-cover"
                alt=""
            >
        `;


        avatar.innerHTML =
            image;


        profileAvatar.innerHTML =
            image;

    }


    const first =
        currentTelegramUser.first_name ||
        "";


    const last =
        currentTelegramUser.last_name ||
        "";


    const fullName =
        (first + " " + last).trim();


    document.getElementById(
        "profileName"
    ).textContent =
        fullName || "Игрок";


    document.getElementById(
        "profileUsername"
    ).textContent =
        currentTelegramUser.username
            ? "@" +
              currentTelegramUser.username
            : "Telegram";
}


/* =====================================================
   МОЙ РЕЙТИНГ
===================================================== */

async function loadMyRating() {

    if (!currentUserId) {
        return;
    }


    try {

        const response =
            await fetch(
                window.location.origin +
                "/rating/user/" +
                currentUserId,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        const rating =
            data.rating ?? 0;


        const games =
            data.games_played ?? 0;


        document.getElementById(
            "myRating"
        ).textContent =
            rating;


        document.getElementById(
            "myGames"
        ).textContent =
            "Сыграно игр: " +
            games;


        document.getElementById(
            "profileRating"
        ).textContent =
            rating;


        document.getElementById(
            "profileGames"
        ).textContent =
            games;


    } catch (error) {

        console.error(
            "Ошибка загрузки рейтинга:",
            error
        );
    }
}


/* =====================================================
   ОБЩИЙ РЕЙТИНГ
===================================================== */

async function loadRating() {

    const leaderboard =
        document.getElementById(
            "leaderboard"
        );


    leaderboard.innerHTML = `
        <div class="bg-zinc-900 rounded-3xl p-5 text-center">
            <p class="text-gray-500">
                Загрузка рейтинга...
            </p>
        </div>
    `;


    try {

        const response =
            await fetch(
                window.location.origin +
                "/rating/",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            leaderboard.innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 text-center">

                    <p class="text-gray-500">
                        Пока нет игроков
                    </p>

                </div>
            `;

            return;
        }


        leaderboard.innerHTML = "";


        data.forEach(
            function(player, index) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "bg-zinc-900 border border-zinc-800 rounded-3xl p-5";


                const first =
                    player.first_name || "";


                const last =
                    player.last_name || "";


                const name =
                    (first + " " + last).trim() ||
                    "Игрок";


                card.innerHTML = `

                    <div class="flex items-center justify-between">

                        <div class="flex items-center gap-4">

                            <div class="w-8 text-center text-lg font-bold text-gray-500">
                                ${index + 1}
                            </div>

                            <div>

                                <p class="font-semibold">
                                    ${name}
                                </p>

                                <p class="text-gray-500 text-sm">
                                    ${player.games_played ?? 0} игр
                                </p>

                            </div>

                        </div>


                        <div class="text-right">

                            <p class="text-xl font-bold">
                                ${player.rating ?? 0}
                            </p>

                            <p class="text-gray-500 text-xs">
                                очков
                            </p>

async function loadGames() {

    const gamesList =
        document.getElementById(
            "gamesList"
        );


    gamesList.innerHTML = `
        <div class="bg-zinc-900 rounded-3xl p-5 text-center">

            <p class="text-gray-500">
                Загрузка игр...
            </p>

        </div>
    `;


    try {

        const response =
            await fetch(
                window.location.origin +
                "/games/",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const games =
            await response.json();


        if (
            !Array.isArray(games) ||
            games.length === 0
        ) {

            gamesList.innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 text-center">

                    <p class="text-gray-400">
                        Пока игр нет
                    </p>

                    <p class="text-gray-600 text-sm mt-2">
                        Здесь появятся ближайшие игры клуба
                    </p>

                </div>
            `;


            updateNextGame(
                null
            );


            return;
        }


        games.sort(
            function(a, b) {

                return new Date(
                    a.start_at
                ) -
                new Date(
                    b.start_at
                );

            }
        );


        gamesList.innerHTML = "";


        for (
            const game of games
        ) {

            let bookings = [];


            try {

                const bookingsResponse =
                    await fetch(
                        window.location.origin +
                        "/bookings/game/" +
                        game.id,
                        {
                            method: "GET",
                            cache: "no-store"
                        }
                    );


                if (
                    bookingsResponse.ok
                ) {

                    bookings =
                        await bookingsResponse.json();
                }


            } catch (error) {

                console.error(
                    "Ошибка загрузки записей:",
                    error
                );
            }


            const confirmedPlayers =
                bookings.filter(
                    function(booking) {

                        return String(
                            booking.status
                        ).toLowerCase() ===
                            "confirmed";

                    }
                ).length;


            const currentBooking =
                bookings.find(
                    function(booking) {

                        const status =
                            String(
                                booking.status
                            ).toLowerCase();


                        return (
                            booking.user_id ===
                            currentUserId
                        ) &&
                        status !==
                            "cancelled";

                    }
                );


            let dateText =
                "Дата не указана";


            let timeText =
                "—";


            if (game.start_at) {

                const date =
                    new Date(
                        game.start_at
                    );


                dateText =
                    date.toLocaleDateString(
                        "ru-RU",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    );


                timeText =
                    date.toLocaleTimeString(
                        "ru-RU",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );
            }


            let buttonHtml =
                "";


            if (currentBooking) {

                const status =
                    String(
                        currentBooking.status
                    ).toLowerCase();


                if (
                    status ===
                    "waiting"
                ) {

                    buttonHtml = `
                        <button
                            onclick="cancelBooking(${currentBooking.id})"
                            class="w-full bg-zinc-800 text-white rounded-2xl py-3.5 font-semibold"
                        >
                            Вы в листе ожидания · Отменить
                        </button>
                    `;

                } else {

                    buttonHtml = `
                        <button
                            onclick="cancelBooking(${currentBooking.id})"
                            class="w-full bg-zinc-800 text-white rounded-2xl py-3.5 font-semibold"
                        >
                            Вы записаны · Отменить
                        </button>
                    `;
                }

            } else if (
                confirmedPlayers >=
                game.max_players
            ) {

                buttonHtml = `
                    <button
                        onclick="createBooking(${game.id})"
                        class="w-full bg-zinc-800 text-gray-300 rounded-2xl py-3.5 font-semibold"
                    >
                        В лист ожидания
                    </button>
                `;

            } else {

                buttonHtml = `
                    <button
                        onclick="createBooking(${game.id})"
                        class="w-full bg-white text-black rounded-2xl py-3.5 font-semibold"
                    >
                        Записаться
                    </button>
                `;
            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "bg-zinc-900 border border-zinc-800 rounded-3xl p-5";


            card.innerHTML = `

                <div class="flex justify-between items-start">

                    <div>

                        <p class="text-gray-500 text-sm">
                            ${dateText}
                        </p>

                        <h2 class="font-semibold text-lg mt-1">
                            ${game.name || "Игра"}
                        </h2>

                    </div>


                    <div class="bg-zinc-800 rounded-xl px-3 py-1.5 text-xs text-gray-300 ml-3">
                        ${game.type || "Игра"}
                    </div>

                </div>


                ${
                    game.description
                        ? `
                            <p class="text-gray-400 text-sm mt-3">
                                ${game.description}
                            </p>
                        `
                        : ""
                }


                <div class="grid grid-cols-2 gap-3 mt-5 mb-4">


                    <div class="bg-zinc-800/60 rounded-2xl p-3">

                        <p class="text-gray-500 text-xs">
                            Время
                        </p>

                        <p class="font-medium mt-1">
                            ${timeText}
                        </p>

                    </div>


                    <div class="bg-zinc-800/60 rounded-2xl p-3">

                        <p class="text-gray-500 text-xs">
                            Игроки
                        </p>

                        <p class="font-medium mt-1">
                            ${confirmedPlayers} / ${game.max_players}
                        </p>

                    </div>

                </div>


                ${
                    game.location
                        ? `
                            <p class="text-gray-500 text-sm mb-4">
                                📍 ${game.location}
                            </p>
                        `
                        : ""
                }


                ${buttonHtml}

            `;


            gamesList.appendChild(
                card
            );
        }


        updateNextGame(
            games[0]
        );


    } catch (error) {

        console.error(
            "Ошибка загрузки игр:",
            error
        );


        gamesList.innerHTML = `
            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 text-center">

                <p class="text-red-400">
                    Не удалось загрузить игры
                </p>

            </div>
        `;
    }
}

async function createBooking(
    tournamentId
) {

    if (!currentUserId) {

        alert(
            "Пользователь ещё не авторизован"
        );

        return;
    }


    try {

        const response =
            await fetch(
                window.location.origin +
                "/bookings/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        user_id:
                            currentUserId,

                        tournament_id:
                            tournamentId
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.detail ||
                "Не удалось записаться"
            );

            return;
        }


        if (
            String(
                data.status
            ).toLowerCase() ===
            "waiting"
        ) {

            alert(
                "Мест нет. Вы добавлены в лист ожидания."
            );

        } else {

            alert(
                "Вы успешно записались на игру!"
            );
        }


        await loadGames();


    } catch (error) {

        console.error(
            "Ошибка записи:",
            error
        );


        alert(
            "Не удалось записаться на игру."
        );
    }
}

   ОТМЕНА

async function cancelBooking(
    bookingId
) {

    try {

        const response =
            await fetch(
                window.location.origin +
                "/bookings/" +
                bookingId,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.detail ||
                "Не удалось отменить запись"
            );

            return;
        }


        alert(
            "Запись отменена."
        );


        await loadGames();


    } catch (error) {

        console.error(
            "Ошибка отмены записи:",
            error
        );


        alert(
            "Не удалось отменить запись."
        );
    }
}

async function createAdminGame() {

    if (!isAdmin) {

        alert(
            "Доступ запрещён"
        );

        return;
    }


    const name =
        document.getElementById(
            "adminGameName"
        ).value.trim();


    if (!name) {

        alert(
            "Введите название игры"
        );

        return;
    }


    const startInput =
        document.getElementById(
            "adminGameStart"
        ).value;


    if (!startInput) {

        alert(
            "Укажите дату и время игры"
        );

        return;
    }


    const deadlineInput =
        document.getElementById(
            "adminGameDeadline"
        ).value;


    const maxPlayers =
        Number(
            document.getElementById(
                "adminGameMaxPlayers"
            ).value
        );


    if (
        !maxPlayers ||
        maxPlayers < 1
    ) {

        alert(
            "Укажите количество игроков"
        );

        return;
    }


    const payload = {

        name: name,

        description:
            document.getElementById(
                "adminGameDescription"
            ).value.trim() ||
            null,

        type:
            document.getElementById(
                "adminGameType"
            ).value,

        format:
            document.getElementById(
                "adminGameFormat"
            ).value.trim() ||
            null,

        location:
            document.getElementById(
                "adminGameLocation"
            ).value.trim() ||
            null,

        image_url:
            document.getElementById(
                "adminGameImage"
            ).value.trim() ||
            null,

        rules:
            document.getElementById(
                "adminGameRules"
            ).value.trim() ||
            null,

        prize_info:
            document.getElementById(
                "adminGamePrize"
            ).value.trim() ||
            null,

        start_at:
            new Date(
                startInput
            ).toISOString(),

        registration_deadline:
            deadlineInput
                ? new Date(
                    deadlineInput
                ).toISOString()
                : null,

        max_players:
            maxPlayers

    };


    try {

        const response =
            await fetch(
                window.location.origin +
                "/admin/games",
                {
                    method: "POST",

                    headers:
                        adminHeaders(),

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.detail ||
                "Не удалось создать игру"
            );

            return;
        }


        alert(
            "Игра создана"
        );


        document.getElementById(
            "adminGameName"
        ).value = "";


        document.getElementById(
            "adminGameDescription"
        ).value = "";


        document.getElementById(
            "adminGameFormat"
        ).value = "";


        document.getElementById(
            "adminGameLocation"
        ).value = "";


        document.getElementById(
            "adminGameImage"
        ).value = "";


        document.getElementById(
            "adminGameRules"
        ).value = "";


        document.getElementById(
            "adminGamePrize"
        ).value = "";


        document.getElementById(
            "adminGameStart"
        ).value = "";


        document.getElementById(
            "adminGameDeadline"
        ).value = "";


        await loadAdminGames();

        await loadGames();


    } catch (error) {

        console.error(
            "Ошибка создания игры:",
            error
        );


        alert(
            "Не удалось создать игру"
        );
    }
}

/* =====================================================
   ЗАЩИТА HTML ОТ КАВЫЧЕК В НАЗВАНИИ
===================================================== */

function escapeAttribute(
    value
) {

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            "&quot;"
        );
}

        "hidden"
    );


    document.getElementById(
        "profileScreen"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "adminScreen"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "adminBookingsScreen"
    ).classList.add(
        "hidden"
    );
}


function showScreen(
    screen
) {

    hideAllScreens();


    if (
        screen ===
        "home"
    ) {

        document.getElementById(
            "homeScreen"
        ).classList.remove(
            "hidden"
        );

        return;
    }


    if (
        screen ===
        "games"
    ) {

        document.getElementById(
            "gamesScreen"
        ).classList.remove(
            "hidden"
        );


        loadGames();

        return;
    }


    if (
        screen ===
        "rating"
    ) {

        document.getElementById(
            "ratingScreen"
        ).classList.remove(
            "hidden"
        );


        loadRating();

        return;
    }


    if (
        screen ===
        "profile"
    ) {

        document.getElementById(
            "profileScreen"
        ).classList.remove(
            "hidden"
        );

        return;
    }


    if (
        screen ===
        "admin"
    ) {

        if (!isAdmin) {

            alert(
                "Доступ запрещён"
            );

            showScreen(
                "home"
            );

            return;
        }


        document.getElementById(
            "adminScreen"
        ).classList.remove(
            "hidden"
        );


        loadAdminGames();

        return;
    }


    if (
        screen ===
        "adminBookings"
    ) {

        if (!isAdmin) {

            alert(
                "Доступ запрещён"
            );

            showScreen(
                "home"
            );

            return;
        }


        document.getElementById(
            "adminBookingsScreen"
        ).classList.remove(
            "hidden"
        );

        return;
    }
}

   ЗАПУСК
===================================================== */

async function initApp() {

    console.log(
        "Poker Club запускается"
    );


    const telegramReady =
        initTelegram();


    if (!telegramReady) {
        return;
    }


    const authorized =
        await authorizeUser();


    if (authorized) {

        await loadMyRating();

        await loadGames();

    }


    console.log(
        "Poker Club запущен"
    );
}


initApp();

</script>

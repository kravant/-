<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Poker Club</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen">

<div class="max-w-md mx-auto px-5 py-6">

    <!-- =========================
         ГЛАВНЫЙ ЭКРАН
    ========================== -->

    <div id="homeScreen">

        <div class="flex justify-between items-center mb-8">

            <div>
                <p class="text-gray-400 text-sm">
                    Добро пожаловать
                </p>

                <h1 class="text-2xl font-bold">
                    Poker Club ♠️
                </h1>
            </div>

            <div
                id="avatar"
                class="w-11 h-11 rounded-full bg-gray-800 flex items-center justify-center text-xl overflow-hidden"
            >
                ♠
            </div>

        </div>


        <!-- Статус авторизации -->

        <div
            id="authStatus"
            class="bg-gray-900 rounded-3xl p-4 mb-5 text-sm text-gray-400"
        >
            Подключение к Telegram...
        </div>


        <!-- Ближайшая игра -->

        <div class="bg-gray-900 rounded-3xl p-5 mb-5">

            <p class="text-gray-400 text-sm mb-2">
                Ближайшая игра
            </p>

            <h2 class="text-xl font-semibold mb-4">
                Пока игр нет
            </h2>

            <div class="space-y-2 text-sm text-gray-300">

                <div class="flex justify-between">
                    <span>Дата</span>
                    <span>—</span>
                </div>

                <div class="flex justify-between">
                    <span>Время</span>
                    <span>—</span>
                </div>

                <div class="flex justify-between">
                    <span>Стол</span>
                    <span>—</span>
                </div>

            </div>

            <button
                onclick="alert('Игры появятся здесь')"
                class="w-full mt-5 bg-white text-black rounded-2xl py-3 font-semibold"
            >
                Посмотреть игры
            </button>

        </div>


        <!-- Мой рейтинг -->

        <div class="bg-gray-900 rounded-3xl p-5 mb-5">

            <p class="text-gray-400 text-sm mb-2">
                Мой рейтинг
            </p>

            <div class="flex items-end gap-2">

                <span
                    id="myRating"
                    class="text-4xl font-bold"
                >
                    0
                </span>

                <span class="text-gray-400 mb-1">
                    очков
                </span>

            </div>

            <p
                id="myGames"
                class="text-gray-500 text-sm mt-2"
            >
                Сыграно игр: 0
            </p>

        </div>

    </div>


    <!-- =========================
         ЭКРАН РЕЙТИНГА
    ========================== -->

    <div id="ratingScreen" class="hidden">

        <div class="flex items-center mb-8">

            <button
                onclick="showScreen('home')"
                class="text-gray-400 mr-4 text-2xl"
            >
                ←
            </button>

            <h1 class="text-2xl font-bold">
                Рейтинг
            </h1>

        </div>

        <div
            id="leaderboard"
            class="space-y-3"
        ></div>

    </div>


    <!-- =========================
         НАВИГАЦИЯ
    ========================== -->

    <div
        id="navigation"
        class="grid grid-cols-3 gap-3 mt-8"
    >

        <button
            onclick="alert('Раздел «Игры»')"
            class="bg-gray-900 rounded-2xl py-4 text-sm"
        >
            🎯
            <br>
            Игры
        </button>

        <button
            onclick="showScreen('rating')"
            class="bg-gray-900 rounded-2xl py-4 text-sm"
        >
            🏆
            <br>
            Рейтинг
        </button>

        <button
            onclick="alert('Раздел «Профиль»')"
            class="bg-gray-900 rounded-2xl py-4 text-sm"
        >
            👤
            <br>
            Профиль
        </button>

    </div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

let tg = null;
let currentUserId = null;


/* =========================
   СТАТУС
========================= */

function setAuthStatus(
    message,
    type = "normal"
) {

    const element =
        document.getElementById(
            "authStatus"
        );

    element.textContent = message;

    element.className =
        "rounded-3xl p-4 mb-5 text-sm";

    if (type === "success") {

        element.classList.add(
            "bg-green-950",
            "text-green-300"
        );

        return;
    }

    if (type === "error") {

        element.classList.add(
            "bg-red-950",
            "text-red-300"
        );

        return;
    }

    element.classList.add(
        "bg-gray-900",
        "text-gray-400"
    );
}


/* =========================
   TELEGRAM SDK
========================= */

function initTelegram() {

    if (
        !window.Telegram ||
        !window.Telegram.WebApp
    ) {

        setAuthStatus(
            "Telegram WebApp SDK не загрузился.",
            "error"
        );

        console.error(
            "Telegram WebApp SDK отсутствует"
        );

        return false;
    }

    tg =
        window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    console.log(
        "Telegram WebApp SDK загружен"
    );

    return true;
}


/* =========================
   АВТОРИЗАЦИЯ
========================= */

async function authorizeUser() {

    if (!tg) {

        return false;
    }

    try {

        const initData =
            tg.initData;

        console.log(
            "Telegram initData:",
            initData
                ? "ЕСТЬ, длина = " + initData.length
                : "НЕТ"
        );


        if (!initData) {

            setAuthStatus(
                "Telegram не передал данные авторизации.",
                "error"
            );

            console.error(
                "tg.initData отсутствует"
            );

            return false;
        }


        setAuthStatus(
            "Авторизация..."
        );


        const response =
            await fetch(
                window.location.origin +
                "/auth/telegram",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        init_data:
                            initData
                    })
                }
            );


        const responseText =
            await response.text();


        if (!response.ok) {

            console.error(
                "Ошибка авторизации:",
                response.status,
                responseText
            );

            setAuthStatus(
                "Ошибка авторизации: HTTP " +
                response.status,
                "error"
            );

            return false;
        }


        const data =
            JSON.parse(
                responseText
            );


        currentUserId =
            data.user_id;


        console.log(
            "Пользователь авторизован:",
            currentUserId
        );


        setAuthStatus(
            "Вы авторизованы",
            "success"
        );


        /* Аватар Telegram */

        if (
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user
        ) {

            const telegramUser =
                tg.initDataUnsafe.user;


            const avatar =
                document.getElementById(
                    "avatar"
                );


            if (
                telegramUser.photo_url
            ) {

                avatar.innerHTML = `
                    <img
                        src="${telegramUser.photo_url}"
                        class="w-full h-full object-cover"
                    >
                `;

            } else {

                avatar.textContent = "♠";
            }
        }


        return true;

    } catch (error) {

        console.error(
            "Ошибка авторизации:",
            error
        );

        setAuthStatus(
            "Не удалось подключиться к серверу.",
            "error"
        );

        return false;
    }
}


/* =========================
   МОЙ РЕЙТИНГ
========================= */

async function loadMyRating() {

    if (!currentUserId) {
        return;
    }


    try {

        const response =
            await fetch(
                window.location.origin +
                "/rating/user/" +
                currentUserId,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        document.getElementById(
            "myRating"
        ).textContent =
            data.rating ?? 0;


        document.getElementById(
            "myGames"
        ).textContent =
            "Сыграно игр: " +
            (data.games_played ?? 0);


    } catch (error) {

        console.error(
            "Ошибка загрузки рейтинга:",
            error
        );
    }
}


/* =========================
   ОБЩИЙ РЕЙТИНГ
========================= */

async function loadRating() {

    const leaderboard =
        document.getElementById(
            "leaderboard"
        );


    leaderboard.innerHTML = `
        <div class="bg-gray-900 rounded-3xl p-5 text-center">
            <p class="text-gray-400">
                Загрузка рейтинга...
            </p>
        </div>
    `;


    try {

        const response =
            await fetch(
                window.location.origin +
                "/rating/",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (!Array.isArray(data)) {

            throw new Error(
                "Сервер вернул не массив"
            );
        }


        if (data.length === 0) {

            leaderboard.innerHTML = `
                <div class="bg-gray-900 rounded-3xl p-5 text-center">

                    <p class="text-gray-400">
                        Пока нет игроков в рейтинге
                    </p>

                </div>
            `;

            return;
        }


        leaderboard.innerHTML = "";


        data.forEach(
            function(
                player,
                index
            ) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "bg-gray-900 rounded-3xl p-5";


                const firstName =
                    player.first_name || "";


                const lastName =
                    player.last_name || "";


                const name =
                    (
                        firstName +
                        " " +
                        lastName
                    ).trim() ||
                    "Игрок";


                const rating =
                    player.rating ?? 0;


                const games =
                    player.games_played ?? 0;


                card.innerHTML = `
                    <div class="flex items-center justify-between">

                        <div class="flex items-center gap-4">

                            <div class="w-8 text-center text-xl font-bold text-gray-400">
                                ${index + 1}
                            </div>

                            <div class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl">
                                ♠
                            </div>

                            <div>

                                <p class="font-semibold">
                                    ${name}
                                </p>

                                <p class="text-gray-500 text-sm">
                                    ${games} игр
                                </p>

                            </div>

                        </div>

                        <div class="text-right">

                            <p class="text-xl font-bold">
                                ${rating}
                            </p>

                            <p class="text-gray-500 text-xs">
                                очков
                            </p>

                        </div>

                    </div>
                `;


                leaderboard.appendChild(
                    card
                );
            }
        );


    } catch (error) {

        console.error(
            "Ошибка загрузки рейтинга:",
            error
        );


        leaderboard.innerHTML = `
            <div class="bg-gray-900 rounded-3xl p-5 text-center">

                <p class="text-red-400 font-semibold">
                    Не удалось загрузить рейтинг
                </p>

                <p class="text-gray-500 text-sm mt-2">
                    Ошибка соединения с сервером
                </p>

            </div>
        `;
    }
}


/* =========================
   ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
========================= */

function showScreen(screen) {

    const homeScreen =
        document.getElementById(
            "homeScreen"
        );


    const ratingScreen =
        document.getElementById(
            "ratingScreen"
        );


    const navigation =
        document.getElementById(
            "navigation"
        );


    if (
        screen === "rating"
    ) {

        homeScreen.classList.add(
            "hidden"
        );

        ratingScreen.classList.remove(
            "hidden"
        );

        navigation.classList.add(
            "hidden"
        );

        loadRating();

        return;
    }


    if (
        screen === "home"
    ) {

        ratingScreen.classList.add(
            "hidden"
        );

        homeScreen.classList.remove(
            "hidden"
        );

        navigation.classList.remove(
            "hidden"
        );
    }
}


/* =========================
   ЗАПУСК
========================= */

async function initApp() {

    console.log(
        "Poker Club запускается"
    );


    const telegramReady =
        initTelegram();


    if (!telegramReady) {

        return;
    }


    const authorized =
        await authorizeUser();


    if (authorized) {

        await loadMyRating();
    }


    console.log(
        "Poker Club запущен"
    );
}


initApp();

</script>

</body>
</html>
